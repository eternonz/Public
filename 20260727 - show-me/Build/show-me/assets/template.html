<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>show-me</title>
<style>
  /* ---- Apple-style tokens (see references/styling.md) ---- */
  :root {
    --bg:#f5f5f7; --surface:#fff; --surface-2:#f2f2f7;
    --text:#1d1d1f; --text-dim:#6e6e73; --separator:rgba(0,0,0,.10);
    --accent:#0071e3; --green:#34c759; --orange:#ff9500; --red:#ff3b30;
    --radius:12px; --radius-lg:20px;
    --shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
    --ease:cubic-bezier(.4,0,.2,1);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e;
      --text:#f5f5f7; --text-dim:#98989d; --separator:rgba(255,255,255,.15);
      --accent:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font-family:var(--font); color:var(--text); background:var(--bg);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding:24px; display:flex; justify-content:center;
  }
  .wrap { width:100%; max-width:960px; }
  header h1 { font-size:1.5rem; font-weight:600; margin:0 0 4px; letter-spacing:-.01em; }
  header p  { color:var(--text-dim); margin:0 0 20px; font-size:.9375rem; }
  .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:16px; }
  button {
    font:inherit; font-weight:600; color:#fff; background:var(--accent);
    border:0; border-radius:980px; padding:8px 18px; cursor:pointer;
    transition:filter .2s var(--ease), transform .2s var(--ease);
  }
  button.secondary { background:var(--surface-2); color:var(--text); }
  button:hover { filter:brightness(1.05); }
  button:active { transform:scale(.97); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input[type=range] { accent-color:var(--accent); }
  .val { font-variant-numeric:tabular-nums; color:var(--text-dim); min-width:3.5em; }
  .stage {
    background:var(--surface); border:1px solid var(--separator);
    border-radius:var(--radius-lg); box-shadow:var(--shadow);
    padding:20px; overflow:auto;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Title</h1>
    <p id="subtitle">One-line description of what this shows.</p>
  </header>

  <!-- Controls row: play/pause/reset/sliders/legend. Remove if static. -->
  <div class="controls" id="controls"><!-- CONTROLS --></div>

  <!-- Main visual mounts here (SVG or <canvas>). -->
  <div class="stage" id="stage"><!-- CONTENT --></div>
</div>

<script>
(function () {
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // ---- LOGIC ----
  // Build the SVG/canvas here, wire controls, drive the animation.
  // Keep vanilla JS, no external deps. Honor `reduce` (no autoplay when true).
})();
</script>
</body>
</html>
