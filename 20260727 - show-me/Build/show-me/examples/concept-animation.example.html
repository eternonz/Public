<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>show-me · Concept Animation</title>
<style>
  :root{
    --bg:#f5f5f7;--surface:#fff;--surface-2:#f2f2f7;--text:#1d1d1f;--text-dim:#6e6e73;
    --separator:rgba(0,0,0,.10);--accent:#0071e3;--green:#34c759;--orange:#ff9500;--red:#ff3b30;
    --radius:12px;--radius-lg:20px;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
    --ease:cubic-bezier(.4,0,.2,1);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--text:#f5f5f7;--text-dim:#98989d;
    --separator:rgba(255,255,255,.15);--accent:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
    --shadow:0 1px 2px rgba(0,0,0,.4);}}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
    line-height:1.45;padding:24px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:960px}
  h1{font-size:1.5rem;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--text-dim);margin:0 0 20px;font-size:.9375rem}
  .controls{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center;margin-bottom:16px}
  button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:980px;
    padding:8px 18px;cursor:pointer;transition:filter .2s var(--ease),transform .2s var(--ease)}
  button.secondary{background:var(--surface-2);color:var(--text)}
  button:hover{filter:brightness(1.05)}button:active{transform:scale(.97)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .field{display:flex;align-items:center;gap:8px;font-size:.875rem}
  .field label{color:var(--text-dim)}
  input[type=range]{accent-color:var(--accent)}
  .val{font-variant-numeric:tabular-nums;color:var(--text);min-width:3.2em;text-align:right}
  .stage{background:var(--surface);border:1px solid var(--separator);border-radius:var(--radius-lg);
    box-shadow:var(--shadow);padding:8px}
  canvas{display:block;width:100%;height:320px;border-radius:var(--radius)}
  .readout{margin-top:10px;color:var(--text-dim);font-size:.8125rem;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>Simple pendulum</h1>
  <p class="sub">θ″ = −(g ⁄ L)·sin θ — swing period grows with length, shrinks with gravity.</p>

  <div class="controls">
    <button id="play">Play</button>
    <button id="reset" class="secondary">Reset</button>
    <div class="field"><label for="g">Gravity</label>
      <input id="g" type="range" min="1" max="20" step="0.1" value="9.8" />
      <span class="val" id="gv">9.8</span></div>
    <div class="field"><label for="L">Length</label>
      <input id="L" type="range" min="0.2" max="3" step="0.05" value="1" />
      <span class="val" id="Lv">1.00 m</span></div>
  </div>

  <div class="stage"><canvas id="c" aria-label="Animated pendulum swinging under gravity"></canvas></div>
  <p class="readout" id="readout"></p>
</div>

<script>
(function(){
  "use strict";
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("c"), ctx=cv.getContext("2d");
  var W=0,H=0,dpr=1;

  function resize(){
    dpr=Math.max(1,window.devicePixelRatio||1);
    var r=cv.getBoundingClientRect(); W=r.width; H=r.height;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }

  // state
  var g=9.8, L=1;           // physical params
  var theta=Math.PI*0.42;   // start angle (from vertical)
  var omega=0;              // angular velocity
  var playing=false, raf=0, last=0;

  var $=function(id){return document.getElementById(id);};
  function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

  function step(dt){
    // clamp dt for display-rate independence; substep for stability
    dt=Math.min(dt,0.033);
    var sub=4, h=dt/sub;
    for(var k=0;k<sub;k++){
      var a=-(g/L)*Math.sin(theta) - 0.02*omega; // tiny damping
      omega+=a*h; theta+=omega*h;
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    var pivotX=W/2, pivotY=H*0.16;
    var px=Math.min(W,H); var rod=Math.max(80, px*0.42*(0.5+L/3)); // longer L => longer rod (visual)
    var bx=pivotX+rod*Math.sin(theta), by=pivotY+rod*Math.cos(theta);

    // arc guide
    ctx.beginPath(); ctx.strokeStyle=css("--separator"); ctx.lineWidth=1;
    ctx.arc(pivotX,pivotY,rod,Math.PI/2-1.1,Math.PI/2+1.1); ctx.stroke();
    // vertical reference
    ctx.beginPath(); ctx.setLineDash([4,5]); ctx.moveTo(pivotX,pivotY); ctx.lineTo(pivotX,pivotY+rod);
    ctx.strokeStyle=css("--separator"); ctx.stroke(); ctx.setLineDash([]);
    // rod
    ctx.beginPath(); ctx.moveTo(pivotX,pivotY); ctx.lineTo(bx,by);
    ctx.strokeStyle=css("--accent"); ctx.lineWidth=3; ctx.stroke();
    // pivot
    ctx.beginPath(); ctx.arc(pivotX,pivotY,4,0,7); ctx.fillStyle=css("--text-dim"); ctx.fill();
    // bob
    ctx.beginPath(); ctx.arc(bx,by,16,0,7); ctx.fillStyle=css("--accent"); ctx.fill();

    var period=2*Math.PI*Math.sqrt(L/g);
    $("readout").textContent="angle "+(theta*180/Math.PI).toFixed(0)+"°   ·   small-swing period T ≈ "+period.toFixed(2)+" s";
  }

  function loop(t){
    if(!playing) return;
    if(!last) last=t;
    var dt=(t-last)/1000; last=t;
    step(dt); draw();
    raf=requestAnimationFrame(loop);
  }
  function play(){ if(playing) return; playing=true; last=0; $("play").textContent="Pause"; raf=requestAnimationFrame(loop); }
  function pause(){ playing=false; $("play").textContent="Play"; cancelAnimationFrame(raf); }
  function reset(){ pause(); theta=Math.PI*0.42; omega=0; draw(); }

  $("play").addEventListener("click",function(){ playing?pause():play(); });
  $("reset").addEventListener("click",reset);
  $("g").addEventListener("input",function(e){ g=parseFloat(e.target.value); $("gv").textContent=g.toFixed(1); draw(); });
  $("L").addEventListener("input",function(e){ L=parseFloat(e.target.value); $("Lv").textContent=L.toFixed(2)+" m"; draw(); });
  window.addEventListener("resize",resize);

  resize();
  if(!reduce) play();   // honor reduced-motion: start paused on a clear displaced frame
})();
</script>
</body>
</html>
